name: Build Amlogic s9xxx (Debug Mode)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/masjeho2/amlogic-s9xxx-openwrt.git
  PROC_LISTS: s905x_s905x2
  KERNEL_VR: 6.6.28
  KERNEL_REPO: ophub/kernel
  BRANCH: 21.02.7
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-20.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        run: |
          echo "::group::System Initialization"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y install pigz
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          echo "::endgroup::"

      - name: Cloning Source
        run: |
          df -hT $PWD
          echo "DEBUG: Cloning $REPO_URL ..."
          git clone --depth 1 $REPO_URL
          
          # Debug: Cek apakah folder terbuat dengan benar
          if [ -d "amlogic-s9xxx-openwrt" ]; then
             echo "DEBUG: Folder clone berhasil dibuat."
          else
             echo "::error::Gagal Clone! Folder amlogic-s9xxx-openwrt tidak ditemukan."
             exit 1
          fi

      - name: Building (With Debug Logic)
        run: |
          # 1. Masuk direktori
          cd amlogic-s9xxx-openwrt
          
          echo "----------------------------------------------------"
          echo "DEBUG: Memeriksa keberadaan script targets/armvirt64.sh"
          echo "DEBUG: Posisi folder saat ini: $(pwd)"
          echo "----------------------------------------------------"

          # 2. Cek apakah file targets/armvirt64.sh ADA?
          if [ -f "targets/armvirt64.sh" ]; then
             echo "DEBUG: Script ditemukan. Menjalankan..."
             sudo chmod +x targets/armvirt64.sh
             sudo ./targets/armvirt64.sh
          else
             # JIKA ERROR, TAMPILKAN PENYEBABNYA
             echo "::error title=Script Hilang::File 'targets/armvirt64.sh' TIDAK DITEMUKAN di dalam repository ini."
             
             echo "----------------------------------------------------"
             echo "DEBUGGING ISI FOLDER (Bukti bahwa file tidak ada):"
             echo "----------------------------------------------------"
             ls -R
             
             echo "::notice::Jika list di atas tidak menunjukkan folder 'targets', berarti Anda salah menggunakan REPO_URL."
             exit 1
          fi
          
          sudo timedatectl set-timezone "${TZ}"
          echo "BUILD_TAG=openwrt-${BRANCH}-$(date +"%Y.%m.%d")" >> ${GITHUB_ENV}

      - name: Repacking (With Debug Logic)
        run: |
          cd amlogic-s9xxx-openwrt/
          
          # Cek file make
          if [ -f "make" ]; then
             sudo chmod +x make
             sudo ./make -b $PROC_LISTS -k $KERNEL_VR -r $KERNEL_REPO -a true
             
             # Cek hasil output image
             if ls out/*.img.gz 1> /dev/null 2>&1; then
                echo "PACKAGED_STATUS=success" >> $GITHUB_ENV
                echo "DEBUG: File Image ditemukan:"
                ls -lh out/
             else
                echo "::error::Repack selesai tapi file .img.gz tidak terbentuk di folder out/"
                ls -R out/
                exit 1
             fi
          else
             echo "::error title=Make Hilang::File 'make' tidak ditemukan! Gagal Repack."
             ls -F
             exit 1
          fi
          
          # Buat body file untuk rilis
          echo "Build Information:" > ../release_body.txt
          echo "- Kernel: $KERNEL_VR" >> ../release_body.txt
          echo "- Date: $(date)" >> ../release_body.txt

      - name: Upload OpenWrt Firmware to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: "amlogic-s9xxx-openwrt/out/*.img.gz,amlogic-s9xxx-openwrt/openwrt-armvirt/*.tar.gz"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release_body.txt
