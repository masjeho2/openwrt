name: Build Amlogic s9xxx (Debug Mode)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/masjeho2/amlogic-s9xxx-openwrt.git
  PROC_LISTS: s905x_s905x2
  KERNEL_VR: 6.6.28
  KERNEL_REPO: ophub/kernel
  BRANCH: 21.02.7
  TZ: Asia/Jakarta

jobs:
  build:
    runs-on: ubuntu-20.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        run: |
          echo "::group::System Clean & Update"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y install pigz
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          echo "::endgroup::"

      - name: Cloning Source
        run: |
          echo "--------------------------------------"
          echo "DEBUG: Mulai Cloning dari $REPO_URL"
          echo "--------------------------------------"
          
          git clone --depth 1 $REPO_URL
          
          # DEBUG: Cek apakah folder berhasil dibuat
          FOLDER_NAME=$(basename $REPO_URL .git)
          if [ -d "$FOLDER_NAME" ]; then
             echo "DEBUG: Folder '$FOLDER_NAME' ditemukan."
             echo "DEBUG: Isi folder root:"
             ls -F
          else
             echo "::error::Gagal Clone! Folder tidak ditemukan."
             exit 1
          fi

      - name: Building (Debug Check)
        run: |
          # Pindah ke folder
          cd amlogic-s9xxx-openwrt
          
          echo "--------------------------------------"
          echo "DEBUG INFO: Posisi saat ini: $(pwd)"
          echo "DEBUG INFO: Isi folder ini:"
          ls -F
          echo "--------------------------------------"

          # CEK 1: Apakah folder targets ada?
          if [ ! -d "targets" ]; then
             echo "::error title=Folder Hilang::Folder 'targets/' tidak ditemukan di dalam repo ini!"
             echo "::notice::Repo ini mungkin hanya alat Repack (bukan source build), atau struktur folder berbeda."
             exit 1
          fi

          # CEK 2: Apakah script armvirt64.sh ada?
          if [ ! -f "targets/armvirt64.sh" ]; then
             echo "::error title=Script Hilang::File 'targets/armvirt64.sh' tidak ditemukan!"
             echo "::group::Isi folder targets (untuk diagnosa):"
             ls -R targets/
             echo "::endgroup::"
             exit 1
          fi

          # Jika semua oke, jalankan
          echo "DEBUG: Menjalankan script build..."
          sudo chmod +x targets/armvirt64.sh
          sudo ./targets/armvirt64.sh
          
          sudo timedatectl set-timezone "${TZ}"
          echo "BUILD_TAG=openwrt-${BRANCH}-$(date +"%Y.%m.%d")" >> ${GITHUB_ENV}

      - name: Repacking (Debug Check)
        run: |
          cd amlogic-s9xxx-openwrt/
          
          # CEK: Apakah script make ada?
          if [ ! -f "make" ]; then
             echo "::error title=File Make Hilang::Script 'make' tidak ditemukan untuk proses repacking!"
             echo "DEBUG: Isi folder saat ini:"
             ls -la
             exit 1
          fi

          echo "DEBUG: Menjalankan Repacking..."
          sudo chmod +x make
          sudo ./make -b $PROC_LISTS -k $KERNEL_VR -r $KERNEL_REPO -a true
          
          # Validasi Output
          if ls out/*.img.gz 1> /dev/null 2>&1; then
             echo "DEBUG: File Image berhasil dibuat!"
             ls -lh out/
             echo "PACKAGED_STATUS=success" >> $GITHUB_ENV
          else
             echo "::error title=Build Gagal::Proses selesai tapi tidak ada file .img.gz di folder out/"
             exit 1
          fi

          # Buat Release Note
          echo "Build Information:" > ../release_body.txt
          echo "- Kernel: $KERNEL_VR" >> ../release_body.txt
          echo "- Date: $(date)" >> ../release_body.txt

      - name: Upload OpenWrt Firmware to Release
        uses: ncipollo/release-action@main
        if: ${{ env.PACKAGED_STATUS }} == 'success' && !cancelled()
        with:
          tag: ${{ env.BUILD_TAG }}
          artifacts: "amlogic-s9xxx-openwrt/out/*.img.gz,amlogic-s9xxx-openwrt/openwrt-armvirt/*.tar.gz"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release_body.txt
